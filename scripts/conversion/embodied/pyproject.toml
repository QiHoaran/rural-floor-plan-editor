[project]
name = "embodied"
version = "0.1.0"
description = "Deterministic rural building exploration and action-observation tokenization"
readme = "README.md"
authors = [
    { name = "gcw_j6bZVekp", email = "gcw_j6bZVekp@noreply.gitcode.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.26.0",
    "networkx>=3.6.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "shapely>=2.1.2",
    "typer>=0.27.1",
]

[project.scripts]
embodied = "embodied.cli:app"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["embodied"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
