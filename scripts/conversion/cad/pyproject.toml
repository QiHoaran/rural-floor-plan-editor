[project]
name = "conversion-cad"
version = "1.0.0"
description = "Deterministic CAD training-data conversion for rural floor plans"
requires-python = ">=3.13"
dependencies = [
    "conversion-shared",
    "ezdxf==1.4.4",
]

[project.scripts]
conversion-cad = "conversion_cad.cli:main"

[tool.uv.sources]
conversion-shared = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
