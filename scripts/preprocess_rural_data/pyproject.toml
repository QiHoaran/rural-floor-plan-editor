[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rural-data-prep"
version = "1.0.0"
description = "Deterministic cleaner for surveyed rural building floorplans"
requires-python = ">=3.13"
dependencies = [
    "ezdxf==1.4.4",
    "Pillow>=12.0,<13",
]

[project.scripts]
rural-data-prep = "rural_data_prep.cli:main"

[tool.setuptools.packages.find]
include = ["rural_data_prep*"]

[tool.uv.workspace]
members = ["rural-embodied-plan"]
