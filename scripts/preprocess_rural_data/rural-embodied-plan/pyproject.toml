[project]
name = "rural-embodied-plan"
version = "0.1.0"
description = "Deterministic rural building exploration and action-observation tokenization"
readme = "README.md"
authors = [
    { name = "gcw_j6bZVekp", email = "gcw_j6bZVekp@noreply.gitcode.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.26.0",
    "networkx>=3.6.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "shapely>=2.1.2",
    "typer>=0.27.1",
]

[project.scripts]
rural-embodied-plan = "rural_embodied_plan.cli:app"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0.12.20260724",
    "types-shapely>=2.1.0.20260728",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["rural_embodied_plan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
