<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>机器人探索 Token 可视化</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">RURAL EMBODIED PLAN</p>
        <h1 id="building-title">机器人探索</h1>
      </div>
      <div class="status-strip" aria-live="polite">
        <span><b id="step-value">0 / 0</b><small>步骤</small></span>
        <span><b id="phase-value">OUTSIDE</b><small>阶段</small></span>
        <span><b id="room-value">室外</b><small>当前位置</small></span>
      </div>
    </header>

    <section class="workspace">
      <section class="plan-panel" aria-labelledby="plan-heading">
        <div class="panel-heading">
          <div>
            <p class="section-label">探索现场</p>
            <h2 id="plan-heading">逐步构建平面图</h2>
          </div>
          <div class="event-summary" id="event-summary">等待开始</div>
        </div>
        <div class="plan-stage">
          <svg id="plan-svg" role="img" aria-labelledby="plan-svg-title plan-svg-desc">
            <title id="plan-svg-title">机器人探索建筑平面图</title>
            <desc id="plan-svg-desc">房间、墙和开口会在机器人观察后逐步显示。</desc>
          </svg>
          <div class="legend" aria-label="图例">
            <span><i class="legend-wall"></i>墙</span>
            <span><i class="legend-door"></i>门</span>
            <span><i class="legend-window"></i>窗</span>
            <span><i class="legend-robot"></i>机器人</span>
          </div>
        </div>
        <div class="controls" aria-label="播放控制">
          <button id="prev-button" type="button" aria-label="上一步">←</button>
          <button id="play-button" class="primary-button" type="button">播放</button>
          <button id="next-button" type="button" aria-label="下一步">→</button>
          <label class="timeline-label" for="timeline">
            <span class="sr-only">探索进度</span>
            <input id="timeline" type="range" min="0" max="0" value="0">
          </label>
          <label class="speed-label" for="speed">速度
            <select id="speed">
              <option value="0.5">0.5×</option>
              <option value="1" selected>1×</option>
              <option value="2">2×</option>
              <option value="4">4×</option>
            </select>
          </label>
        </div>
      </section>

      <aside class="token-panel" aria-labelledby="token-heading">
        <div class="panel-heading token-heading-row">
          <div>
            <p class="section-label">ACTION · OBSERVATION</p>
            <h2 id="token-heading">Token 流</h2>
          </div>
          <span id="token-count" class="token-count">0</span>
        </div>
        <details class="graph-metadata">
          <summary>图元数据 Token</summary>
          <div id="graph-tokens" class="token-cloud"></div>
        </details>
        <div id="event-tokens" class="token-stream" aria-live="polite">
          <p class="empty-state">播放探索以生成 Token</p>
        </div>
      </aside>
    </section>
  </main>
  <div id="fatal-error" class="fatal-error" hidden role="alert"></div>
  <script src="/app.js"></script>
</body>
</html>
